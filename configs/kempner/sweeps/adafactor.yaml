sweep:
  - optimizer:
      name: adafactorw
      learning_rate: [1.0e-4, 3.16e-4, 1.0e-3, 3.16e-3, 1.0e-2, 3.16e-2]
#      learning_rate: [1.0e-1]
      neuron_only: true
