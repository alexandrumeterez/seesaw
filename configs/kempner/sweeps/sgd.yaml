# 63 jobs
wandb:
  group: sgd-150-2
# device_train_microbatch_size: 128
# max_duration: 100000 # 13.1B tokens / (256 batch * 512 context)
optimizer:
  weight_decay: 0.0
  eps: 1.0e-15
  beta_1: 0.95
# save_count_log_scale_unsharded: 10
save_num_unsharded_checkpoints_to_keep: 1 #11
sweep:
  - optimizer:
      name: sgdw
      use_dampening: true
      beta_0: [0.0, 0.5, 0.8, 0.9, 0.95, 0.98, 0.99]
      learning_rate: [1.0e-1, 3.16e-1, 1.0, 3.16, 10.0, 31.6, 100.0, 316.0, 1000.0]
