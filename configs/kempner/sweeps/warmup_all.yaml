# 6 jobs
wandb:
  group: warmup-all-1
device_train_microbatch_size: 128
optimizer:
  eps: 1.0e-15
  beta_0: 0.9
  beta_1: 0.95
  weight_decay: 0.0
# save_count_log_scale_unsharded: 10
save_num_unsharded_checkpoints_to_keep: 1
sweep:
  - optimizer:
      name: adamw
      learning_rate: 3.16e-3
      decouple_weight_decay: true
    scheduler:
      t_warmup: [15000, 20000] # [500, 1250, 2500, 5000, 10000]
  - optimizer:
      name: sgdw
      beta_0: 0.98
      learning_rate: 1.0
    scheduler:
      t_warmup: [15000, 20000] #[500, 1250, 2500, 5000]
  - optimizer:
      name: signsgd
      learning_rate: 3.16e-4
    scheduler:
      t_warmup: [15000, 20000] #[500, 1250, 2500, 5000]
  - optimizer:
      name: lionw
      learning_rate: 3.16e-4
    scheduler:
      t_warmup: [15000, 20000] #[500, 1250, 2500, 5000]
  - optimizer:
      name: adafactorw
      learning_rate: 3.16e-3
      neuron_only: false
    scheduler:
      t_warmup: [15000, 20000] #[500, 1250, 2500, 5000]
  - optimizer: 
      name: novagradw # corrected novograd
      learning_rate: 3.16e-3
      att_correction: true
      lastlayer_correction: true
    scheduler:
      t_warmup: [15000, 20000] #[500, 1250, 2500, 5000]
