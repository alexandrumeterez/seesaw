# 21 jobs
wandb:
  group: momentum-300-tied-1
#device_train_microbatch_size: 128
optimizer:
  weight_decay: 0.0
  eps: 1.0e-15
  tie_betas: true
save_count_log_scale_unsharded: 10
save_num_unsharded_checkpoints_to_keep: 1
sweep:
  - optimizer:
      name: adamw
      learning_rate: 3.16e-3
      beta_0: [0.0, 0.5, 0.8, 0.9, 0.95, 0.98, 0.99]
  - optimizer:
      name: adafactorw
      learning_rate: 3.16e-3
      neuron_only: false
      beta_0: [0.0, 0.5, 0.8, 0.9, 0.95, 0.98, 0.99]
  - optimizer: 
      name: novagradw # corrected novograd
      learning_rate: 3.16e-3
      att_correction: true
      lastlayer_correction: true
      beta_0: [0.0, 0.5, 0.8, 0.9, 0.95, 0.98, 0.99]
