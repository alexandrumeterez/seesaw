# 35 jobs
wandb:
  group: momentum-llama-1
device_train_microbatch_size: 128
softmax_auxiliary_loss: false
model:
  attention_layer_norm: false
  layer_norm_type: rms
  activation_type: swiglu
optimizer:
  weight_decay: 0.1
  eps: 1.0e-15
  beta_1: 0.95
# save_count_log_scale_unsharded: 10
save_num_unsharded_checkpoints_to_keep: 1
sweep:
  - optimizer:
      name: adamw
      learning_rate: 1.0e-3
      beta_0: [0.0, 0.5, 0.8, 0.9, 0.95, 0.98, 0.99]
  - optimizer:
      name: sgdw
      learning_rate: 3.16e-2
      beta_0: [0.0, 0.5, 0.8, 0.9, 0.95, 0.98, 0.99]
  # - optimizer:
  #     name: signsgd
  #     learning_rate: 3.16e-4
  #     beta_0: [0.0, 0.5, 0.8, 0.9, 0.95, 0.98, 0.99]
  - optimizer:
      name: lionw
      learning_rate: 3.16e-4
      beta_0: [0.0, 0.5, 0.8, 0.9, 0.95, 0.98, 0.99]
  - optimizer:
      name: adafactorw
      learning_rate: 1.0e-3
      neuron_only: false
      beta_0: [0.0, 0.5, 0.8, 0.9, 0.95, 0.98, 0.99]
  - optimizer: 
      name: novagradw # corrected novograd
      learning_rate: 1.0e-3
      att_correction: true
      lastlayer_correction: true
      beta_0: [0.0, 0.5, 0.8, 0.9, 0.95, 0.98, 0.99]
  # - optimizer:
  #     name: sophiag
  #     eps: 0.02
  #     learning_rate: 1.0e-2
  #     beta_0: [0.0, 0.5, 0.8, 0.9, 0.95, 0.98, 0.99]
