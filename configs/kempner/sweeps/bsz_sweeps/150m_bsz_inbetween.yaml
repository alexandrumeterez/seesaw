wandb:
  group: final-bsz-adam-continuous 
  project: batch-size-sched
  name: 150m-adam-half
optimizer: 
  beta_0: 0.9
  beta_1: 0.95
  eps: 1.0e-8
  decouple_weight_decay: false
  weight_decay: 0.0
  decay_norm_and_bias: true
  decay_embeddings: true
  metrics_log_interval: 100
