# 20 jobs 
sweep:
  - device_train_microbatch_size: 64
    wandb:
      group: lr-wd-2
    optimizer:
      name: adamw
      learning_rate: [1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1]
      beta_0: 0.9
      beta_1: 0.95
      eps: 1.0e-15
      decouple_weight_decay: true
      weight_decay: [1.0e-4, 1.0e-5] # [0.001, 0.01, 0.1, 1.0]
      decay_norm_and_bias: true
      decay_embeddings: true
      metrics_log_interval: 100
    