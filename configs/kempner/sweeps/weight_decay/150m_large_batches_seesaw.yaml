wandb:
  group: seesaw-weight-decay-adam-sweep 
  project: batch-size-sched
  name: 150m-adam
optimizer: 
  beta_0: 0.9
  beta_1: 0.95
  eps: 1.0e-8
  decouple_weight_decay: true 
  decay_norm_and_bias: true
  decay_embeddings: true
  metrics_log_interval: 100
sweep:
  - scheduler:
      batch_size_increase_factor: 1.1
      name: ["step_cosine_half_with_warmup"]
      lr_decay_factor: 0.953462
      t_warmup: 3.3e8
      units: "tokens"
      lr_decay_factor_for_token_counts: 0.9090909
    global_train_batch_size: 128
    max_duration: 3.3e9T
    optimizer:
      name: adamw
      learning_rate: 3e-3
      weight_decay: 1e-4
  - scheduler:
      batch_size_increase_factor: 1.1
      name: ["step_cosine_half_with_warmup"]
      lr_decay_factor: 0.953462
      t_warmup: 3.3e8
      units: "tokens"
      lr_decay_factor_for_token_counts: 0.9090909
    global_train_batch_size: 256
    max_duration: 3.3e9T
    optimizer:
      name: adamw
      learning_rate: 3e-3
      weight_decay: 1e-4
  - scheduler:
      batch_size_increase_factor: 1.1
      name: ["step_cosine_half_with_warmup"]
      lr_decay_factor: 0.953462
      t_warmup: 3.3e8
      units: "tokens"
      lr_decay_factor_for_token_counts: 0.9090909
    global_train_batch_size: 512
    max_duration: 3.3e9T
    optimizer:
      name: adamw
      learning_rate: 1e-2
      weight_decay: 1e-3
  - scheduler:
      batch_size_increase_factor: 1.1
      name: ["step_cosine_half_with_warmup"]
      lr_decay_factor: 0.953462
      t_warmup: 3.3e8
      units: "tokens"
      lr_decay_factor_for_token_counts: 0.9090909
    global_train_batch_size: 512
    max_duration: 3.3e9T
    optimizer:
      name: adamw
      learning_rate: 3e-3
      weight_decay: 1e-4